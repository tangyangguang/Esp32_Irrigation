[platformio]
default_envs = esp32_irrigation_arduino3
extra_configs =
  platformio.local.ini

[size_flags]
build_flags =
  -fno-exceptions
  -flto

[env:esp32_irrigation_arduino3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
  framework-arduinoespressif32-libs @ file://../../../foundation/Esp32Base/local_private/toolchains/esp32-core-3.3.8-tls-fd6058a00d6b06aa
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions/esp32-4mb-ota.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
extra_scripts =
  pre:scripts/check_generated_web_assets.py
  post:../../../foundation/Esp32Base/scripts/esp32base_webota.py
  post:scripts/check_ota_image_size.py
lib_deps =
  bblanchon/ArduinoJson@6.21.6
  symlink://../../../platform/iot-device-sdk
  Networking
  Hash
  ESP32 Async UDP
  Preferences
  FS
  DNSServer
  ESPmDNS
  LittleFS
  Update
  WebServer
  WiFi
  Wire
  symlink://../../../foundation/Esp32Base
build_flags =
  ${size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_IOT
  -D ESP32BASE_MQTT_MAX_PAYLOAD_BYTES=4096
  -D ESP32BASE_MQTT_MAX_INCOMING_PAYLOAD_BYTES=4096
  -D ESP32BASE_MQTT_MAX_OUTBOX_BYTES=4352
  -D ESP32BASE_WEB_MAX_ROUTES=12
  -D ESP32BASE_WEB_MAX_STATIC_ASSETS=10
  -D ESP32BASE_ENABLE_RECORD_STORE=1
  -D ESP32BASE_ENABLE_CONDITIONS=1
  -D ESP32BASE_ENABLE_APP_CONFIG=1
  -D ESP32BASE_APP_CONFIG_MAX_GROUPS=6
  ; IrrigationParameterConfig currently registers exactly 22 fields.
  -D ESP32BASE_APP_CONFIG_MAX_FIELDS=22
  -D ESP32BASE_ENABLE_RTC=1
  -D ESP32BASE_RTC_DRIVER=ESP32BASE_RTC_DRIVER_DS3231
  -D ESP32BASE_NTP_GMT_OFFSET_SEC=28800
  -D ESP32BASE_NTP_DAYLIGHT_OFFSET_SEC=0
  -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_INFO
  -D ESP32BASE_EB_FILELOG_DEFAULT_MODE=ESP32BASE_FILELOG_MODE_WARN
  -D ESP32BASE_DEFAULT_HOSTNAME=\"irrigation-controller\"
  -include src/irrigation/RequireTlsDates.h
  -I local_private
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/DNSServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Hash/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/LittleFS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
  bblanchon/ArduinoJson@6.21.6
  symlink://../../../platform/iot-device-sdk
build_src_filter =
  -<*>
  +<irrigation/IrrigationConfig.cpp>
  +<irrigation/IrrigationConfigJson.cpp>
  +<irrigation/IrrigationIotProtocol.cpp>
  +<irrigation/IrrigationCommandJournal.cpp>
  +<irrigation/IrrigationTime.cpp>
  +<irrigation/FlowMonitor.cpp>
  +<irrigation/WateringController.cpp>
  +<irrigation/WateringRecordCodec.cpp>
  +<irrigation/WateringScheduler.cpp>
  +<irrigation/UnexpectedFlowMonitor.cpp>
test_filter =
  test_config
  test_controller
  test_records
  test_scheduler
  test_unexpected_flow
  test_time
  test_iot_protocol
  test_command_journal

[env:native_iot_vectors]
extends = env:native
test_filter =
  test_iot_vectors

[env:esp32_record_test]
platform = platformio/espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions/esp32-4mb-ota.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
test_framework = unity
test_build_src = yes
test_filter =
  test_record_store_device
lib_deps =
  bblanchon/ArduinoJson@6.21.6
  symlink://../../../platform/iot-device-sdk
  Preferences
  FS
  LittleFS
  Wire
  symlink://../../../foundation/Esp32Base
build_src_filter =
  -<*>
  +<irrigation/DeviceAliveCheckpoint.cpp>
  +<irrigation/IrrigationAuditStore.cpp>
  +<irrigation/IrrigationEvents.cpp>
  +<irrigation/IrrigationIotProtocol.cpp>
  +<irrigation/IrrigationRecordSync.cpp>
  +<irrigation/WateringRecordCodec.cpp>
  +<irrigation/WateringRecordStore.cpp>
  +<irrigation/WateringScheduler.cpp>
  +<irrigation/WateringSchedulerStore.cpp>
build_flags =
  -fno-exceptions
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_OFFLINE
  -D ESP32BASE_ENABLE_RECORD_STORE=1
  -D ESP32BASE_ENABLE_CONDITIONS=1
  -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_INFO
  -D ESP32BASE_EB_FILELOG_DEFAULT_MODE=ESP32BASE_FILELOG_MODE_WARN
