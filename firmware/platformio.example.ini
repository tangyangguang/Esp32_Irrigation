# Copy this file to platformio.local.ini and adjust it for your device.
# platformio.local.ini is ignored by git and is loaded by platformio.ini.
#
# [env:esp32_irrigation]
# custom_esp32base_webota_host = <device-ip>
# custom_esp32base_webota_user = <web-user>
# custom_esp32base_webota_password = <web-password>
#
# MQTT credentials are compiled into the local firmware image through a
# generated header. The generator never prints their values. The CA file is
# kept separately because PEM certificates do not fit INI values cleanly.
# custom_irrigation_mqtt_host = <broker-hostname>
# custom_irrigation_mqtt_port = 8883
# custom_irrigation_mqtt_username = <device-user>
# custom_irrigation_mqtt_password = <device-password>
# custom_irrigation_mqtt_topic_prefix = irrigation
# custom_irrigation_mqtt_ca_file = mqtt-ca.local.crt
