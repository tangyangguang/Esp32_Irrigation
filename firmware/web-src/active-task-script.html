<script>(function(){var live=document.getElementById('run-live'),initialActive=!!live;function duration(v){v=Math.max(0,Number(v)||0);if(v<60)return v+' 秒';if(v<3600)return Math.floor(v/60)+' 分 '+(v%60)+' 秒';return Math.floor(v/3600)+' 小时 '+Math.floor((v%3600)/60)+' 分'}function liters(v){return((Number(v)||0)/1000).toFixed(3)+' L'}function flow(v){return((Number(v)||0)/1000).toFixed(3)+' L/min'}function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v}var inputs=document.querySelectorAll('.run-custom-duration'),submit=document.getElementById('run-custom-submit');function updateCustom(){var count=0,total=0;inputs.forEach(function(i){var v=Math.max(0,Math.min(Number(i.max)||0,Number(i.value)||0));if(v>0){count++;total+=v}});set('run-custom-summary',count?('已选择 '+count+' 条水路 · 合计 '+total+' 分钟'):'尚未选择水路');if(submit)submit.disabled=count===0}inputs.forEach(function(i){i.addEventListener('input',updateCustom)});window.runCustomSubmit=function(form){updateCustom();if(!submit||submit.disabled){alert('请至少为一条水路设置大于 0 的时长。');return false}return confirm('确认按当前自定义时长立即开始浇水？')&&once(form)};updateCustom();if(!initialActive){function idlePoll(){fetch('/irrigation/api/status',{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.json()}).then(function(s){if(s.active)location.reload();else setTimeout(idlePoll,5000)}).catch(function(){setTimeout(idlePoll,10000)})}setTimeout(idlePoll,5000);return}var canvas=document.getElementById('run-flow-chart'),empty=document.getElementById('run-chart-empty'),samples=[],generation=Number(live.dataset.generation||0),serial=Number(live.dataset.serial||0),expectedFlow=Number(live.dataset.expectedFlow||0);
function rangeDuration(value){if(value<60)return value+' 秒';if(value%60===0)return value/60+' 分钟';return Math.floor(value/60)+' 分 '+value%60+' 秒'}
function draw(){
if(!canvas)return;
var rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=Math.max(280,rect.width),h=205,left=52,right=12,top=14,bottom=28,plotW=w-left-right,plotH=h-top-bottom;
canvas.width=w*dpr;canvas.height=h*dpr;
var c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);c.font='11px sans-serif';c.fillStyle='#667085';c.textBaseline='middle';
var count=samples.length,coverage=Math.min(600,count*5);
set('run-chart-range',count?('最近 '+rangeDuration(coverage)+' · 5 秒/点'):'正在等待数据 · 5 秒/点');
var maximum=count?Math.max.apply(null,samples)/1000:1;if(expectedFlow>0)maximum=Math.max(maximum,expectedFlow/1000);var rough=Math.max(maximum*1.08,1)/4,power=Math.pow(10,Math.floor(Math.log(rough)/Math.LN10)),normalized=rough/power,steps=[1,2,2.5,5,10],step=steps[steps.length-1]*power;
for(var s=0;s<steps.length;s++){if(normalized<=steps[s]){step=steps[s]*power;break}}
var scale=step*4;
function yText(value){if(value===0)return '0';if(value>=10)return String(Math.round(value));return value.toFixed(value>=1?1:2)}
for(var yi=0;yi<=4;yi++){var value=step*yi,y=top+plotH*(1-yi/4);c.strokeStyle=yi===0?'#cbd7dd':'#e7edef';c.lineWidth=1;c.beginPath();c.moveTo(left,y);c.lineTo(w-right,y);c.stroke();c.fillStyle='#667085';c.textAlign='right';c.fillText(yText(value),left-8,y)}
if(count){var maximumLabels=w<500?5:6,minimumStep=coverage/Math.max(1,maximumLabels-1),timeSteps=[5,10,15,30,60,120],timeStep=timeSteps[timeSteps.length-1];for(var ts=0;ts<timeSteps.length;ts++){if(timeSteps[ts]>=minimumStep){timeStep=timeSteps[ts];break}}var ticks=[coverage],next=Math.floor((coverage-1)/timeStep)*timeStep;while(next>0){ticks.push(next);next-=timeStep}ticks.push(0);ticks.forEach(function(ago){var x=left+plotW*(1-ago/coverage);c.strokeStyle='#eef2f4';c.beginPath();c.moveTo(x,top);c.lineTo(x,top+plotH);c.stroke();var label=ago===0?'现在':rangeDuration(ago)+'前';c.fillStyle='#667085';c.textBaseline='bottom';c.textAlign=ago===coverage?'left':(ago===0?'right':'center');c.fillText(label,x,h-2)})}
if(count===0){if(empty)empty.style.display='flex';return}
if(empty)empty.style.display='none';
if(expectedFlow>0){var baseline=expectedFlow/1000,baselineY=top+plotH*(1-baseline/scale);c.save();c.setLineDash([5,4]);c.strokeStyle='#7b8d94';c.lineWidth=1;c.beginPath();c.moveTo(left,baselineY);c.lineTo(w-right,baselineY);c.stroke();c.restore();c.fillStyle='#667085';c.textAlign='right';c.textBaseline='bottom';c.fillText('基准 '+baseline.toFixed(3),w-right-4,baselineY-3)}
c.strokeStyle='#117b8b';c.lineWidth=2;c.lineJoin='round';c.lineCap='round';c.beginPath();
samples.forEach(function(value,index){var x=left+plotW*((index+1)/count),y=top+plotH*(1-(value/1000)/scale);if(index===0)c.moveTo(x,y);else c.lineTo(x,y)});
c.stroke();
var latest=samples[count-1]/1000,latestX=w-right,latestY=top+plotH*(1-latest/scale);c.fillStyle='#117b8b';c.beginPath();c.arc(latestX,latestY,3.5,0,Math.PI*2);c.fill()
}
function loadHistory(){fetch('/irrigation/api/flow-history',{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.json()}).then(function(h){samples=Array.isArray(h.samples)?h.samples.slice(-120):[];generation=Number(h.generation||0);serial=Number(h.latestSerial||0);draw()}).catch(function(){setTimeout(loadHistory,2000)})}function update(s){set('run-elapsed',duration(s.elapsedSec));set('run-remaining',duration(s.plannedRemainingSec));set('run-water',liters(s.totalEstimatedWaterMl));set('run-step-count','第 '+(Number(s.currentStepIndex)+1)+' / '+s.stepCount+' 条水路');var activeZone=s.zones[s.currentStepIndex]||{},waterTarget=Number(activeZone.targetWaterMl)||0;set('run-current-elapsed','实际浇水 '+duration(s.currentZoneElapsedSec)+(waterTarget?' / 目标 '+liters(waterTarget):' / '+duration(activeZone.plannedDurationSec)));set('run-current-remaining',(waterTarget?'安全时限剩余 ':'剩余 ')+duration(s.currentZoneRemainingSec));set('run-flow',flow(s.currentFlowMlPerMinute));expectedFlow=Number(s.expectedFlowMlPerMinute||0);set('run-expected-flow',expectedFlow?flow(expectedFlow):'未设置');set('run-pulses',s.pulseCount);set('run-zone-water',liters(activeZone.estimatedWaterMl));var current=document.querySelector('[data-step-index=\"'+s.currentStepIndex+'\"]'),zoneName='水路 '+s.zoneId;if(current){var name=current.querySelector('.run-step-name');if(name)zoneName=name.textContent;set('run-current-zone',zoneName)}var states=['空闲','区域启动中','等待水流','正在浇水','区域停止中','水路切换中'],phase=Number(s.state)===3?(s.flowEstablished?'水流已建立':'等待水流建立'):(states[s.state]||'未知');set('run-state',zoneName+' · '+phase);var target=waterTarget||Number(activeZone.plannedDurationSec)||0,value=waterTarget?Number(activeZone.estimatedWaterMl):Number(s.currentZoneElapsedSec),percent=target?Math.min(100,Math.round(value*100/target)):0,bar=document.getElementById('run-current-progress');if(bar)bar.style.width=percent+'%';var flowState=document.getElementById('run-flow-state');if(flowState){var flowTone='warn',flowLabel='等待水流';if(Number(s.state)===5){flowTone='info';flowLabel='水路切换中'}else if(s.flowEstablished&&!expectedFlow){flowTone='info';flowLabel='水流已建立'}else if(s.flowEstablished&&activeZone.lowFlowActive){flowTone='warn';flowLabel='低流量'}else if(s.flowEstablished&&activeZone.highFlowActive){flowTone='danger';flowLabel='高流量'}else if(s.flowEstablished){flowTone='info';flowLabel='流量监测中'}flowState.textContent=flowLabel;flowState.className='tag '+flowTone}document.querySelectorAll('.run-step').forEach(function(row){var i=Number(row.dataset.stepIndex),z=s.zones[i]||{},icon=row.querySelector('.run-step-icon'),detail=row.querySelector('.run-step-detail');row.classList.toggle('complete',i<s.currentStepIndex);row.classList.toggle('current',i===s.currentStepIndex);if(icon)icon.textContent=i<s.currentStepIndex?'✓':String(i+1);if(detail){if(i<s.currentStepIndex)detail.textContent='实际 '+duration(z.actualWateringSec)+' · '+liters(z.estimatedWaterMl);else if(i===s.currentStepIndex)detail.textContent=Number(s.state)===5?'等待开阀':'正在执行 · '+(Number(z.targetWaterMl)?'已出 '+liters(z.estimatedWaterMl):'剩余 '+duration(s.currentZoneRemainingSec));else detail.textContent='等待执行'}});var nextGeneration=Number(s.flowHistoryGeneration||0),nextSerial=Number(s.flowSampleSerial||0);if(nextGeneration!==generation){generation=nextGeneration;loadHistory()}else if(nextSerial!==serial){if(nextSerial===serial+1){samples.push(Number(s.currentFlowMlPerMinute)||0);if(samples.length>120)samples.shift();serial=nextSerial;draw()}else loadHistory()}}function finished(){try{sessionStorage.setItem('irrigationJustFinished','1')}catch(ignore){}location.reload()}function poll(){fetch('/irrigation/api/status',{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.json()}).then(function(s){if(!s.active){finished();return}update(s);setTimeout(poll,1000)}).catch(function(){setTimeout(poll,2000)})}window.addEventListener('resize',draw);loadHistory();setTimeout(poll,1000)})();</script>
