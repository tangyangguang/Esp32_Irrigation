<style>
/* 灌溉业务页共享样式：只放跨页面复用的紧凑组件，不覆盖基础库全局类。 */
.irr-back{margin:0 0 10px}
/* 紧凑筛选条：小标签在上，控件在下，桌面横向排列，手机两列 */
.irr-filter{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;margin:0 0 12px}
.irr-filter label{display:grid;gap:3px;margin:0;color:var(--eb-muted);font-size:12px;font-weight:400}
.irr-filter select,.irr-filter input[type=date]{width:auto;max-width:none;min-height:32px;margin:0;padding:4px 9px;border:1px solid #ccd5dd;border-radius:7px;background:#fff;color:#1f2933;font-size:13px;font-family:inherit}
.irr-filter input[type=date]{width:158px}
.irr-filter select:focus,.irr-filter input[type=date]:focus{outline:none;border-color:var(--eb-primary);box-shadow:0 0 0 2px var(--eb-primary-soft)}
.irr-filter input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
.irr-filter button,.irr-filter .btnlink{min-height:32px;margin:0}
.irr-filter .btnlink{padding:0 10px}
@media(max-width:760px){.irr-filter{display:grid;grid-template-columns:1fr 1fr;align-items:end}.irr-filter label,.irr-filter select,.irr-filter input[type=date]{width:100%}.irr-filter>button,.irr-filter>.btnlink{grid-column:1/-1}}
/* 设置类入口列表：一行一项，左文右链接 */
.irr-setlist{margin:0;padding:0;list-style:none}
.irr-setlist li{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--eb-line-soft)}
.irr-setlist li:last-child{border-bottom:0}
.irr-setlist b{font-weight:600}
.irr-setlist small{display:block;margin-top:2px;color:var(--eb-muted);font-size:12px;font-weight:400}
.irr-setlist .side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto}
.irr-setlist .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.irr-setlist .btnlink{flex:0 0 auto}
@media(max-width:760px){.irr-setlist li{flex-direction:column;align-items:stretch;gap:8px}.irr-setlist .side{width:100%;justify-content:space-between}.irr-setlist .btnlink{min-height:36px}}
.irr-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 0}
.irr-metrics>div{min-width:0;padding:10px 11px;border:1px solid var(--eb-line-soft);border-radius:8px;background:var(--eb-soft)}
.irr-metrics span{display:block;color:var(--eb-muted);font-size:11px}
.irr-metrics b{display:block;margin-top:3px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.irr-metrics small{display:block;margin-top:2px;color:var(--eb-muted);font-size:11px}
@media(max-width:760px){.irr-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.irr-metrics{grid-template-columns:1fr}}
/* 页码分页条 */
.irr-pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;margin:14px 0 4px}
.irr-page{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 8px;border:1px solid var(--eb-line,#ccd5dd);border-radius:8px;background:#fff;color:var(--eb-ink);font-size:13px;font-variant-numeric:tabular-nums;line-height:1;text-decoration:none;box-sizing:border-box}
a.irr-page:hover{border-color:var(--eb-primary);color:var(--eb-primary);background:var(--eb-primary-soft)}
.irr-page.is-current{border-color:var(--eb-primary);background:var(--eb-primary);color:#fff;font-weight:600}
.irr-page.is-disabled{opacity:.4;pointer-events:none}
.irr-page-step{font-size:16px;font-weight:600}
.irr-page-gap{display:inline-flex;align-items:center;min-width:24px;height:32px;justify-content:center;color:var(--eb-muted);user-select:none}
@media(max-width:420px){.irr-pager{gap:4px}.irr-page{min-width:30px;height:30px;padding:0 6px;font-size:12px}}
</style>
