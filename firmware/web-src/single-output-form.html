

                    </div>
                </section>
                <div class="single-output-workspace">
                    <div class="single-output-editor">
                        <div id="single-volume-target" class="single-output-target">
                            <label class="single-output-target-label" for="single-volume-input">目标水量</label>
                            <div class="single-output-value-row">
                                <button type="button" class="single-output-stepper" data-volume-delta="-0.1" aria-label="减少 0.1 升">−</button>
                                <div class="single-output-value">
                                    <input id="single-volume-input" type="number" name="target_liters" min="0.1" step="0.1" value="1.0" inputmode="decimal">
                                    <span class="single-output-unit">L</span>
                                </div>
                                <button type="button" class="single-output-stepper" data-volume-delta="0.1" aria-label="增加 0.1 升">+</button>
                            </div>
                            <small class="single-output-help">按流量计脉冲估算，支持 0.1 L 步进。</small>
                            <div class="single-output-presets" aria-label="常用水量">
                                <button type="button" data-volume="1">1 L</button>
                                <button type="button" data-volume="5">5 L</button>
                                <button type="button" data-volume="10">10 L</button>
                                <button type="button" data-volume="20">20 L</button>
                            </div>
                        </div>
                        <p id="single-output-estimate" class="single-output-estimate" hidden></p>
                    </div>
                </div>
                <p id="single-output-note" class="single-output-note"></p>
                <div class="single-output-submit">
                    <span id="single-output-summary" class="single-output-summary"></span>
                    <input id="single-output-submit" type="submit" value="开始本次浇水">
                </div>
                </form>
                <script>
(function(){
var form=document.getElementById('single-output-form');if(!form)return;
var input=document.getElementById('single-volume-input'),summary=document.getElementById('single-output-summary'),note=document.getElementById('single-output-note');
var maximum=Number(form.dataset.maxVolumeLiters)||0;input.max=String(maximum);
if(form.dataset.targetLiters)input.value=form.dataset.targetLiters;
function update(){var zone=form.querySelector('[name="zone_id"]:checked');summary.textContent=zone?'本次按水量浇水 · '+input.value+' L':'请选择水路';note.textContent='水量依据流量计估算；达到最长运行时间仍未达目标时，停止并记录失败。';}
form.querySelectorAll('[data-volume],[data-volume-delta]').forEach(function(button){button.addEventListener('click',function(){var value=button.hasAttribute('data-volume')?Number(button.dataset.volume):(Number(input.value)||0)+Number(button.dataset.volumeDelta);input.value=Math.max(.1,Math.min(maximum,value)).toFixed(1);update()})});
form.addEventListener('input',update);form.addEventListener('change',update);
window.submitSingleOutput=function(form){return form.reportValidity()&&confirm('确认按目标水量 '+input.value+' L 开始浇水？')&&once(form)};update();
})();
</script>
