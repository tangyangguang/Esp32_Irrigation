<script>(function(){
var clock=document.getElementById('home-clock'),clockTime=document.getElementById('home-clock-time'),clockDate=document.getElementById('home-clock-date');if(clock&&clock.dataset.epoch){var clockBase=Number(clock.dataset.epoch),clockStarted=performance.now();function clockPad(v){return String(v).padStart(2,'0')}function updateClock(){var epoch=clockBase+Math.floor((performance.now()-clockStarted)/1000),d=new Date((epoch+28800)*1000);if(clockTime)clockTime.textContent=clockPad(d.getUTCHours())+':'+clockPad(d.getUTCMinutes())+':'+clockPad(d.getUTCSeconds());if(clockDate)clockDate.textContent=d.getUTCFullYear()+'年'+(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日'}updateClock();setInterval(updateClock,1000)}
var form=document.getElementById('manual-form');
if(form){
var rows=Array.prototype.slice.call(form.querySelectorAll('.manual-zone')),submit=document.getElementById('manual-submit'),summary=document.getElementById('manual-summary'),note=document.getElementById('manual-template-note'),cards=Array.prototype.slice.call(form.querySelectorAll('.manual-template-card'));
function rowOf(el){return el.closest('.manual-zone')}
function setMode(row,volume,silent){
var select=row.querySelector('.manual-mode'),input=row.querySelector('.manual-value'),unit=row.querySelector('.manual-unit'),
maxMinutes=Number(row.dataset.maxMinutes)||120,maxLiters=Number(row.dataset.maxLiters)||100;
select.value=volume?'volume':'duration';
if(volume){input.step='0.1';input.max=String(maxLiters);unit.textContent='L'}
else{input.step='1';input.max=String(maxMinutes);unit.textContent='分钟'}
if(!silent&&note)note.textContent='当前设置已手动调整，不会修改任何计划。';
}
rows.forEach(function(row){
var input=row.querySelector('.manual-value');
row.querySelector('.manual-mode').addEventListener('change',function(){setMode(row,row.querySelector('.manual-mode').value==='volume')});
input.addEventListener('input',function(){cards.forEach(function(card){card.classList.remove('selected')});if(note)note.textContent='当前设置已手动调整，不会修改任何计划。';update()});
});
function update(){
var count=0,durationMinutes=0,volumeCount=0,maxMinutes=120;
rows.forEach(function(row){
var value=Number(row.querySelector('.manual-value').value)||0;
if(!(value>0))return;
++count;maxMinutes=Number(row.dataset.maxMinutes)||maxMinutes;
if(row.querySelector('.manual-mode').value==='volume')++volumeCount;else durationMinutes+=value;
});
if(summary){
if(!count)summary.textContent='尚未选择水路';
else{
var text='已选择 '+count+' 条水路';
if(count-volumeCount>0)text+=' · 时长合计 '+durationMinutes+' 分钟';
if(volumeCount>0)text+=' · '+volumeCount+' 条按水量';
if(volumeCount>0)text+='（按水量每条安全时限最长 '+maxMinutes+' 分钟，全程最多约 '+(durationMinutes+volumeCount*maxMinutes)+' 分钟）';
summary.textContent=text;
}
}
if(submit)submit.disabled=count===0;
return{count:count,durationMinutes:durationMinutes,volumeCount:volumeCount};
}
cards.forEach(function(card){card.addEventListener('click',function(){if(card.disabled)return;var values=(card.dataset.durations||'').split(',');rows.forEach(function(row,index){row.querySelector('.manual-value').value=values[Number(row.dataset.zoneIndex)]||0;setMode(row,false,true)});cards.forEach(function(item){item.classList.toggle('selected',item===card)});if(note)note.textContent='已从“'+(card.dataset.planName||'计划')+'”填入，可继续修改或改为按水量；本次修改不会保存到计划。';update()})});
var clear=document.getElementById('manual-clear');if(clear)clear.addEventListener('click',function(){rows.forEach(function(row){row.querySelector('.manual-value').value=0});cards.forEach(function(card){card.classList.remove('selected')});if(note)note.textContent='已全部清零。';update()});
window.submitManualWatering=function(){
var s=update();if(!s.count){alert('请至少为一条水路设置大于 0 的时长或水量。');return false}
var message='确认手动浇水 '+s.count+' 条水路？';
if(s.durationMinutes)message+='\n按时长合计 '+s.durationMinutes+' 分钟';
if(s.volumeCount)message+='\n按水量 '+s.volumeCount+' 条，达到最长运行时间仍未达目标水量时会停止并记录失败';
return form.reportValidity()&&confirm(message)&&once(form);
};
update();
}
// Observe only on the idle overview. Never poll or replace a form being edited.
var watch=document.querySelector('[data-home-watch]');if(watch){var timer=0,failures=0,polls=0;function poll(){if(document.hidden)return;fetch('/irrigation/api/status',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(s){var hero=document.getElementById('home-hero');if(hero&&(!!s.unexpectedFlowAlarm!==(hero.dataset.flowAlarm==='1')||!!s.rtcUnavailable!==(hero.dataset.rtcUnavailable==='1'))){location.reload();return}failures=0;watch.textContent='运行状态更新于 '+new Date().toLocaleTimeString();watch.className='muted';if((watch.dataset.homeWatch==='maintenance'?!s.active:s.active)||Number(s.historyNextId)!==Number(watch.dataset.recordNext)||++polls>=12){location.reload();return}timer=setTimeout(poll,5000)}).catch(function(){watch.textContent='状态未能更新，请检查与设备的连接。当前显示可能已过时。';watch.className='notice warn';timer=setTimeout(poll,Math.min(30000,5000*Math.pow(2,++failures)))})}document.addEventListener('visibilitychange',function(){clearTimeout(timer);if(!document.hidden)poll()});timer=setTimeout(poll,5000)}
})();
</script>
