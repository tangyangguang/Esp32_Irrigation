<script>
(function(){
'use strict';
var dirty=false,submitting=false;
function duration(s){s=Math.max(0,Number(s)||0);return Math.floor(s/60)+' 分 '+s%60+' 秒'}
function refreshSummary(){var total=0,count=0;document.querySelectorAll("form[action='/irrigation/manual'] input[name^='zone']").forEach(function(input){var s=Number(input.value)||0;if(s>0){count++;total+=s}});var target=document.getElementById('manual-summary');if(target)target.textContent=count?'本次 '+count+' 条水路，目标浇水 '+duration(total):'尚未设置本次浇水时长'}
document.querySelectorAll("form[action='/irrigation/manual'] input[name^='zone']").forEach(function(input){
 if(input.name==='zone_id')return;
 var value=Number(input.value)||0,max=Number(input.max)||0;input.type='hidden';
 var wrap=document.createElement('span');wrap.className='duration-editor';
 var min=document.createElement('input');min.type='number';min.min='0';min.max=String(Math.floor(max/60));min.value=String(Math.floor(value/60));min.setAttribute('aria-label','分钟');
 var more=document.createElement('details');var title=document.createElement('summary');title.textContent='秒';more.appendChild(title);
 var sec=document.createElement('input');sec.type='number';sec.min='0';sec.max='59';sec.value=String(value%60);sec.setAttribute('aria-label','额外秒数');more.appendChild(sec);if(value%60)more.open=true;
 wrap.appendChild(min);wrap.appendChild(document.createTextNode('分'));wrap.appendChild(more);input.after(wrap);
 var unit=wrap.nextElementSibling;if(unit&&unit.textContent==='秒')unit.remove();
 function sync(){var m=Number(min.value),s=Number(sec.value);var total=m*60+s;min.setCustomValidity(Number.isInteger(m)&&m>=0&&Number.isInteger(s)&&s>=0&&s<60&&total<=max?'':'请检查时长和运行上限');input.value=String(total);refreshSummary()}
 min.addEventListener('input',sync);sec.addEventListener('input',sync);input.addEventListener('change',function(){var value=Number(input.value)||0;min.value=String(Math.floor(value/60));sec.value=String(value%60);sync()});
});
document.querySelectorAll('[data-fill-times]').forEach(function(button){button.addEventListener('click',function(){button.dataset.fillTimes.split(',').forEach(function(value,i){var input=document.querySelector("form[action='/irrigation/manual'] [name='zone"+(i+1)+"']");if(input){input.value=value;input.dispatchEvent(new Event('change',{bubbles:true}))}});dirty=true;refreshSummary()})});
refreshSummary();
document.querySelectorAll('[data-dirty-form]').forEach(function(form){form.addEventListener('input',function(){dirty=true})});
document.addEventListener('submit',function(event){var form=event.target;if(event.defaultPrevented||form.hasAttribute('data-eb-ajax'))return;if(form.dataset.sent){event.preventDefault();return}form.dataset.sent='1';submitting=true;form.querySelectorAll('button[type=submit],button:not([type]),input[type=submit]').forEach(function(button){button.disabled=true});var note=document.createElement('p');note.setAttribute('role','status');note.textContent='正在提交，请等待设备响应…';form.appendChild(note)});
window.addEventListener('beforeunload',function(event){if(dirty&&!submitting){event.preventDefault();event.returnValue=''}});
// Observe only on the idle overview. Never poll or replace a form being edited.
var watch=document.querySelector('[data-home-watch]');if(watch){var timer=0,failures=0,polls=0;function poll(){if(document.hidden)return;fetch('/irrigation/api/status',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(s){failures=0;watch.textContent='运行状态更新于 '+new Date().toLocaleTimeString();watch.className='caption';if((watch.dataset.homeWatch==='maintenance'?!s.active:s.active)||Number(s.historyNextId)!==Number(watch.dataset.recordNext)||++polls>=12){location.reload();return}timer=setTimeout(poll,5000)}).catch(function(){watch.textContent='状态未能更新，请检查与设备的连接。当前显示可能已过时。';watch.className='stale-indicator';timer=setTimeout(poll,Math.min(30000,5000*Math.pow(2,++failures)))})}document.addEventListener('visibilitychange',function(){clearTimeout(timer);if(!document.hidden)poll()});timer=setTimeout(poll,5000)}
})();
</script>
