<script>(function(){
var recentCard=document.getElementById('home-recent-card');try{if(recentCard&&sessionStorage.getItem('irrigationJustFinished')==='1'){sessionStorage.removeItem('irrigationJustFinished');recentCard.classList.add('just-finished');setTimeout(function(){recentCard.classList.remove('just-finished')},3600)}}catch(ignore){}
var clock=document.getElementById('home-clock'),clockTime=document.getElementById('home-clock-time'),clockDate=document.getElementById('home-clock-date');if(clock&&clock.dataset.epoch){var clockBase=Number(clock.dataset.epoch),clockStarted=performance.now();function clockPad(v){return String(v).padStart(2,'0')}function updateClock(){var epoch=clockBase+Math.floor((performance.now()-clockStarted)/1000),d=new Date((epoch+28800)*1000);if(clockTime)clockTime.textContent=clockPad(d.getUTCHours())+':'+clockPad(d.getUTCMinutes())+':'+clockPad(d.getUTCSeconds());if(clockDate)clockDate.textContent=d.getUTCFullYear()+'年'+(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日'}updateClock();setInterval(updateClock,1000)}
var inputs=Array.prototype.slice.call(document.querySelectorAll('.manual-duration')),submit=document.getElementById('manual-submit'),summary=document.getElementById('manual-summary'),note=document.getElementById('manual-template-note'),cards=Array.prototype.slice.call(document.querySelectorAll('.manual-template-card')),applyingTemplate=false,count=0,total=0;
var extra=Array.prototype.slice.call(document.querySelectorAll('.manual-extra-seconds'));
function totalText(){return Math.floor(total/60)+' 分钟'+(total%60?' '+total%60+' 秒':'')}
function update(){count=0;total=0;inputs.forEach(function(input,index){var minutes=Number(input.value)||0,seconds=Number(extra[index]&&extra[index].value)||0,value=minutes*60+seconds;input.setCustomValidity(value<=(Number(input.max)||0)*60?'':'总时长超过运行上限');if(value>0){count++;total+=value}});if(summary)summary.textContent=count?('已选择 '+count+' 条水路 · 合计 '+totalText()):'尚未选择水路';if(submit)submit.disabled=count===0}
extra.forEach(function(input){input.addEventListener('input',function(){update();cards.forEach(function(card){card.classList.remove('selected')});if(note)note.textContent='当前时长已手动调整，不会修改任何计划。'})});

inputs.forEach(function(input){input.addEventListener('input',function(){update();if(applyingTemplate)return;cards.forEach(function(card){card.classList.remove('selected')});if(note)note.textContent='当前时长已手动调整，不会修改任何计划。'})});
cards.forEach(function(card){card.addEventListener('click',function(){if(card.disabled)return;var values=(card.dataset.durations||'').split(',');applyingTemplate=true;inputs.forEach(function(input){input.value=values[Number(input.dataset.zoneIndex)]||0});extra.forEach(function(input){input.value=0});applyingTemplate=false;cards.forEach(function(item){item.classList.toggle('selected',item===card)});if(note)note.textContent='已从“'+(card.dataset.planName||'计划')+'”填入，可继续修改；本次修改不会保存到计划。';update()})});
var clear=document.getElementById('manual-clear');if(clear)clear.addEventListener('click',function(){inputs.forEach(function(input){input.value=0});extra.forEach(function(input){input.value=0});cards.forEach(function(card){card.classList.remove('selected')});if(note)note.textContent='已全部清零。';update()});
window.submitManualWatering=function(form){update();if(!count){alert('请至少为一条水路设置大于 0 的时长。');return false}return form.reportValidity()&&confirm('确认手动浇水 '+count+' 条水路，合计 '+totalText()+'？')&&once(form)};update();
// Observe only on the idle overview. Never poll or replace a form being edited.
var watch=document.querySelector('[data-home-watch]');if(watch){var timer=0,failures=0,polls=0;function poll(){if(document.hidden)return;fetch('/irrigation/api/status',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(s){var hero=document.getElementById('home-hero');if(hero&&(!!s.unexpectedFlowAlarm!==(hero.dataset.flowAlarm==='1')||!!s.rtcUnavailable!==(hero.dataset.rtcUnavailable==='1'))){location.reload();return}failures=0;watch.textContent='运行状态更新于 '+new Date().toLocaleTimeString();watch.className='muted';if((watch.dataset.homeWatch==='maintenance'?!s.active:s.active)||Number(s.historyNextId)!==Number(watch.dataset.recordNext)||++polls>=12){location.reload();return}timer=setTimeout(poll,5000)}).catch(function(){watch.textContent='状态未能更新，请检查与设备的连接。当前显示可能已过时。';watch.className='notice warn';timer=setTimeout(poll,Math.min(30000,5000*Math.pow(2,++failures)))})}document.addEventListener('visibilitychange',function(){clearTimeout(timer);if(!document.hidden)poll()});timer=setTimeout(poll,5000)}
})();
</script>
